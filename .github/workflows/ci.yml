name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Lint
        run: flake8 container_lint tests --max-line-length=120 --ignore=E501,W503

      - name: CLI end-to-end check on the bundled example
        run: |
          set +e
          container-lint examples --format json > lint.json
          test $? -eq 1
          python -c "import json;d=json.load(open('lint.json'));assert len(d)==14, len(d)"
          python -c "import json;print(sorted({i['rule'] for i in json.load(open('lint.json'))}))"
