name: container-lint
description: Lint Dockerfiles and docker-compose files without a Docker daemon
author: Ankita Salaria
branding:
  icon: check-circle
  color: blue

inputs:
  paths:
    description: Files or directories to lint
    required: false
    default: "."
  fail-on:
    description: Lowest severity that fails the job (error, warning, info, never)
    required: false
    default: warning
  format:
    description: Output format (text, json, sarif)
    required: false
    default: text
  working-directory:
    description: Directory to run in
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Install container-lint
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet "$GITHUB_ACTION_PATH"

    - name: Lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        container-lint ${{ inputs.paths }} \
          --format ${{ inputs.format }} \
          --fail-on ${{ inputs.fail-on }}
